<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Byte8 CHIP-8 Web Emulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111418;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      margin-bottom: 16px;
      text-align: center;
    }
    h1 {
      font-size: 26px;
      color: #00ffcc;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 13px;
      color: #8892b0;
      margin-top: 4px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #1a1e24;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 1px solid #28303d;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      border: 2px solid #00ffcc;
      border-radius: 4px;
      box-shadow: 0 0 16px rgba(0, 255, 204, 0.2);
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    select, button, label {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #333d4d;
      background: #252b36;
      color: #e0e0e0;
      cursor: pointer;
      outline: none;
    }
    select:hover, button:hover {
      background: #313947;
      border-color: #00ffcc;
    }
    button.primary {
      background: #00ffcc;
      color: #111418;
      font-weight: bold;
      border: none;
    }
    button.primary:hover {
      background: #00d6aa;
    }
    .keypad-guide {
      margin-top: 10px;
      font-size: 12px;
      color: #8892b0;
      text-align: center;
      line-height: 1.6;
    }
    .key-badge {
      display: inline-block;
      padding: 1px 5px;
      background: #28303d;
      border-radius: 3px;
      font-family: monospace;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <header>
    <h1>Byte8 CHIP-8 Web Emulator</h1>
    <div class="subtitle">Compiled directly to WebAssembly (4.4 KB standalone)</div>
  </header>

  <div class="container">
    <canvas id="screen" width="640" height="320"></canvas>

    <div class="controls">
      <select id="romSelect">
        <option value="../roms/pong.ch8">Pong Game</option>
        <option value="../roms/snake.ch8">Snake Game</option>
        <option value="../roms/demo.ch8">Logo & Font Demo</option>
      </select>

      <select id="themeSelect">
        <option value="cyber">Cyber Cyan</option>
        <option value="matrix">Matrix Green</option>
        <option value="amber">Amber CRT</option>
        <option value="gameboy">Game Boy</option>
        <option value="classic">Classic B&W</option>
      </select>

      <button id="loadBtn" class="primary">Load Selected</button>
      <button id="resetBtn">Restart</button>

      <label style="cursor: pointer;">
        Upload ROM (.ch8)
        <input type="file" id="fileInput" accept=".ch8" style="display: none;">
      </label>
    </div>

    <div class="keypad-guide">
      <b>Keyboard Controls:</b><br>
      Keys: <span class="key-badge">1</span> <span class="key-badge">2</span> <span class="key-badge">3</span> <span class="key-badge">4</span> | 
      <span class="key-badge">Q</span> <span class="key-badge">W</span> <span class="key-badge">E</span> <span class="key-badge">R</span> | 
      <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> <span class="key-badge">F</span> | 
      <span class="key-badge">Z</span> <span class="key-badge">X</span> <span class="key-badge">C</span> <span class="key-badge">V</span><br>
      <i>In Snake: 2=UP, S=DOWN, Q=LEFT, E=RIGHT</i>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const romSelect = document.getElementById('romSelect');
    const themeSelect = document.getElementById('themeSelect');
    const loadBtn = document.getElementById('loadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const fileInput = document.getElementById('fileInput');

    const THEMES = {
      cyber:   { bg: '#100c24', fg: '#00ffcc', border: '#00ffcc' },
      matrix:  { bg: '#051205', fg: '#00ff46', border: '#00ff46' },
      amber:   { bg: '#180e02', fg: '#ffb000', border: '#ffb000' },
      gameboy: { bg: '#0f380f', fg: '#9bbc0f', border: '#9bbc0f' },
      classic: { bg: '#000000', fg: '#ffffff', border: '#8892b0' },
    };
    let currentTheme = THEMES.cyber;

    themeSelect.addEventListener('change', () => {
      currentTheme = THEMES[themeSelect.value] || THEMES.cyber;
      canvas.style.borderColor = currentTheme.border;
      canvas.style.boxShadow = `0 0 16px ${currentTheme.border}44`;
      if (wasmExports) renderScreen();
    });

    const SCALE = 10;
    const VIDEO_WIDTH = 64;
    const VIDEO_HEIGHT = 32;

    let wasmExports = null;
    let wasmMemory = null;
    let romBufferOffset = 0;
    let gfxBufferOffset = 0;
    let currentRomBytes = null;
    let animFrameId = null;

    // Web Audio synthesizer for buzzer
    let audioCtx = null;
    let oscNode = null;
    let gainNode = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscNode = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();
      oscNode.type = 'square';
      oscNode.frequency.setValueAtTime(440, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      oscNode.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscNode.start();
    }

    function setBuzzer(active) {
      if (!gainNode || !audioCtx) return;
      gainNode.gain.setTargetAtTime(active ? 0.08 : 0, audioCtx.currentTime, 0.015);
    }

    // Hex keypad mapping
    const KEY_MAP = {
      '1': 0x1, '2': 0x2, '3': 0x3, '4': 0xC,
      'q': 0x4, 'w': 0x5, 'e': 0x6, 'r': 0xD,
      'a': 0x7, 's': 0x8, 'd': 0x9, 'f': 0xE,
      'z': 0xA, 'x': 0x0, 'c': 0xB, 'v': 0xF
    };

    window.addEventListener('keydown', (e) => {
      initAudio();
      const k = KEY_MAP[e.key.toLowerCase()];
      if (k !== undefined && wasmExports) {
        wasmExports.chip8_wasm_set_key(k, 1);
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = KEY_MAP[e.key.toLowerCase()];
      if (k !== undefined && wasmExports) {
        wasmExports.chip8_wasm_set_key(k, 0);
      }
    });

    function renderScreen() {
      const gfx = new Uint8Array(wasmMemory.buffer, gfxBufferOffset, VIDEO_WIDTH * VIDEO_HEIGHT);
      ctx.fillStyle = currentTheme.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = currentTheme.fg;
      for (let y = 0; y < VIDEO_HEIGHT; y++) {
        for (let x = 0; x < VIDEO_WIDTH; x++) {
          if (gfx[y * VIDEO_WIDTH + x]) {
            ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
          }
        }
      }
    }

    function loadRom(bytes) {
      currentRomBytes = bytes;
      if (!wasmExports) return;

      wasmExports.chip8_wasm_init();
      const romView = new Uint8Array(wasmMemory.buffer, romBufferOffset, bytes.length);
      romView.set(bytes);
      renderScreen();
    }

    let lastTimerTime = performance.now();
    function loop(now) {
      if (!wasmExports) return;

      // 9 CPU cycles per frame (~540 Hz at 60 FPS)
      for (let i = 0; i < 9; i++) {
        wasmExports.chip8_wasm_cycle();
      }

      // 60 Hz timer decrement
      if (now - lastTimerTime >= 16.66) {
        wasmExports.chip8_wasm_update_timers();
        lastTimerTime = now;
        setBuzzer(wasmExports.chip8_wasm_get_sound_timer() > 0);
      }

      if (wasmExports.chip8_wasm_get_draw_flag()) {
        renderScreen();
        wasmExports.chip8_wasm_clear_draw_flag();
      }

      animFrameId = requestAnimationFrame(loop);
    }

    async function init() {
      const resp = await fetch('chip8.wasm');
      const wasmBytes = await resp.arrayBuffer();
      const mod = await WebAssembly.instantiate(wasmBytes);
      wasmExports = mod.instance.exports;
      wasmMemory = wasmExports.memory;

      romBufferOffset = wasmExports.chip8_wasm_get_rom_buffer();
      gfxBufferOffset = wasmExports.chip8_wasm_get_gfx_buffer();

      // Load initial ROM
      const romResp = await fetch(romSelect.value);
      const romBytes = new Uint8Array(await romResp.arrayBuffer());
      loadRom(romBytes);

      animFrameId = requestAnimationFrame(loop);
    }

    loadBtn.addEventListener('click', async () => {
      initAudio();
      const resp = await fetch(romSelect.value);
      const bytes = new Uint8Array(await resp.arrayBuffer());
      loadRom(bytes);
    });

    resetBtn.addEventListener('click', () => {
      initAudio();
      if (currentRomBytes) {
        loadRom(currentRomBytes);
      }
    });

    fileInput.addEventListener('change', (e) => {
      initAudio();
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const bytes = new Uint8Array(reader.result);
        loadRom(bytes);
      };
      reader.readAsArrayBuffer(file);
    });

    init();
  </script>
</body>
</html>
