name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev clang

      - name: Build all targets with ${{ matrix.compiler }}
        run: |
          make clean
          make all CC=${{ matrix.compiler }}

      - name: Run complete test suite
        run: |
          CC=${{ matrix.compiler }} make test

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer
        run: |
          make asan CC=${{ matrix.compiler }}


